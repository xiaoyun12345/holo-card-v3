<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" href="data:," />
    <title>白相 · White Atelier</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="gate" id="gate">
      <style>
        .gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 50% 0%,#20242e 0%,#101216 62%,#0a0b0e 100%);transition:opacity .5s ease,visibility .5s ease;font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.gate.gate-open{opacity:0;visibility:hidden;pointer-events:none}.gate-box{width:min(88vw,340px);text-align:center;color:#f4f1e8;padding:34px 30px 30px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.05);box-shadow:0 24px 60px rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.gate-mark{font-size:12px;letter-spacing:.32em;color:rgba(244,241,232,.55);margin:0 0 14px}.gate-title{font-size:26px;font-weight:700;margin:0 0 6px;letter-spacing:.14em}.gate-hint{font-size:13px;color:rgba(244,241,232,.6);margin:0 0 22px}.gate-input{display:block;box-sizing:border-box;width:100%;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#f4f1e8;font-size:16px;text-align:center;outline:none;transition:border-color .2s ease}.gate-input:focus{border-color:rgba(255,255,255,.55)}.gate-btn{display:block;box-sizing:border-box;width:100%;margin-top:14px;padding:11px 0;border:none;border-radius:10px;background:#e8e2d0;color:#15171c;font-size:15px;font-weight:600;letter-spacing:.22em;cursor:pointer;transition:filter .2s ease,transform .12s ease}.gate-btn:active{transform:scale(.98)}.gate-btn:hover{filter:brightness(1.06)}.gate-msg{min-height:18px;margin:12px 0 0;font-size:13px;color:#ff9d9d}
      </style>
      <div class="gate-box">
        <p class="gate-mark">WHITE ATELIER · 白相</p>
        <h1 class="gate-title">私人展室</h1>
        <p class="gate-hint">请输入访问密码进入</p>
        <input
          id="gate-password"
          class="gate-input"
          type="password"
          placeholder="访问密码"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <button id="gate-btn" class="gate-btn" type="button">进入展室</button>
        <p id="gate-msg" class="gate-msg"></p>
      </div>
    </div>
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="白相首页"
        ><span class="wordmark-cn">白相<span class="brand-dot"></span></span
        ><span class="wordmark-en">WHITE ATELIER</span></a
      >
      <span class="collection-label"
        >个人典藏 <span>/</span> <span id="edition">STUDY 001</span></span
      >
      <div class="header-actions">
        <button
          class="icon-button"
          id="info"
          aria-label="作品信息"
          title="作品信息"
          disabled
        >
          <i data-lucide="info"></i>
        </button>
        <button
          class="icon-button save-button"
          id="save"
          aria-label="保存卡片图片"
          title="保存卡片图片"
          disabled
        >
          <i data-lucide="download"></i>
        </button>
      </div>
    </header>
    <main>
      <section class="gallery" aria-label="卡片展台">
        <div
          class="stage"
          id="stage"
          tabindex="0"
          role="group"
          aria-label="可旋转的全息卡片"
        >
          <div id="loading" class="loading" role="status">
            <span class="loading-line"></span><span>正在装裱作品</span>
          </div>
          <div class="stage-floats" id="stage-floats">
            <button
              class="icon-button float-btn"
              id="gyro-toggle"
              aria-label="开启陀螺仪控制"
              title="开启陀螺仪控制"
              aria-pressed="false"
              disabled
            >
              <i data-lucide="rotate-3d"></i>
            </button>
            <button
              class="icon-button float-btn"
              id="fullscreen-toggle"
              aria-label="全屏显示"
              title="全屏显示"
              aria-pressed="false"
              disabled
            >
              <i data-lucide="maximize"></i>
            </button>
          </div>
        </div>
        <div class="stage-note" aria-hidden="true">
          <span>ART STUDY</span><span id="view-label">01 / FRONT</span>
        </div>
        <div class="parameter-panel" id="parameter-panel">
          <div class="panel-heading">
            <span>景深与构图</span>
          </div>
          <label class="range-row" for="scale"
            ><span>画面比例</span><output id="scale-value"></output
            ><input id="scale" type="range" min="0.95" max="1.35" step="0.01"
          /></label>
          <label class="range-row" for="depth"
            ><span>画面景深</span><output id="depth-value"></output
            ><input id="depth" type="range" min="-0.45" max="0.45" step="0.01"
          /></label>
          <label class="range-row" for="fx-depth"
            ><span>特效景深</span><output id="fx-depth-value"></output
            ><input id="fx-depth" type="range" min="-0.3" max="0.9" step="0.01"
          /></label>
          <label class="range-row" for="bg-depth"
            ><span>底纹景深</span><output id="bg-depth-value"></output
            ><input id="bg-depth" type="range" min="-0.4" max="0.4" step="0.01"
          /></label>
        </div>
      </section>
      <section class="card-switcher" id="card-switcher" aria-label="卡牌切换">
        <button
          id="prev-card"
          class="switch-arrow"
          type="button"
          aria-label="上一张"
          title="上一张（A）"
        >
          ‹
        </button>
        <div
          class="thumb-strip"
          id="thumb-strip"
          role="tablist"
          aria-label="全部卡牌"
        ></div>
        <button
          id="next-card"
          class="switch-arrow"
          type="button"
          aria-label="下一张"
          title="下一张（D）"
        >
          ›
        </button>
      </section>
      <section class="artwork-bar" aria-label="作品与材质">
        <div class="artwork-title">
          <div class="title-line">
            <h1 id="card-title">BOND</h1>
            <span id="subtitle">共生</span>
          </div>
          <p id="description">光与影，彼此相依。</p>
        </div>
        <div class="face-picker" role="group" aria-label="卡片朝向">
          <button id="front" aria-pressed="true" disabled>正面</button
          ><button id="back" aria-pressed="false" disabled>背面</button>
        </div>
        <div class="finish-cluster">
          <button
            id="depth-toggle"
            class="depth-toggle"
            type="button"
            aria-controls="parameter-panel"
            aria-expanded="true"
            aria-label="显示或隐藏景深调整"
            title="显示或隐藏景深调整"
          >
            <i data-lucide="sliders-horizontal"></i><span>景深调整</span>
          </button>
          <div class="finish-control">
          <div class="finish-heading">
            <span>卡面质感</span>
            <div class="swatches" role="group" aria-label="卡面材质">
              <button
                class="swatch pearl"
                data-finish="pearl"
                aria-pressed="true"
                aria-label="珠光"
                title="珠光"
                disabled
              ></button
              ><button
                class="swatch silver"
                data-finish="silver"
                aria-pressed="false"
                aria-label="银箔"
                title="银箔"
                disabled
              ></button
              ><button
                class="swatch gold"
                data-finish="gold"
                aria-pressed="true"
                aria-label="烫金"
                title="烫金"
                disabled
              ></button
              ><button
                class="swatch original"
                data-finish="original"
                aria-pressed="false"
                aria-label="原画"
                title="原画"
                disabled
              ></button>
            </div>
            <span id="finish-name">烫金</span>
          </div>
          <label class="foil-row" for="foil"
            ><span>光泽</span
            ><input
              id="foil"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.52"
              disabled
            /><output id="foil-value">52%</output></label
          >
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <span>光影之间，自有回响。</span><span>PERSONAL ART COLLECTION</span>
    </footer>
    <dialog id="about" aria-labelledby="about-title">
      <button
        id="close-about"
        class="icon-button modal-close"
        aria-label="关闭作品信息"
        title="关闭作品信息"
      >
        <i data-lucide="x"></i>
      </button>
      <p class="dialog-mark">白相</p>
      <h2 id="about-title">共生 / BOND</h2>
      <p id="about-description"></p>
      <dl>
        <div>
          <dt>来源</dt>
          <dd>用户提供的参考作品</dd>
        </div>
        <div>
          <dt>呈现</dt>
          <dd>个人艺术卡片习作</dd>
        </div>
        <div>
          <dt>编号</dt>
          <dd id="about-edition">STUDY 001</dd>
        </div>
      </dl>
    </dialog>
    <div id="notice" role="status" class="notice" hidden></div>
    <script>
      (function () {
        var PASSWORDS = [
          "63b8538a9faf326de13249c0d50f3b38a4da16756113e1adf3c9c7e7551017c9",
          "25f5bb792ffc08dd1bc21c51600f4760f14140fb7d8e565de9b8d4f7821e557b"
        ];
        var gate = document.getElementById("gate");
        var input = document.getElementById("gate-password");
        var msg = document.getElementById("gate-msg");
        var btn = document.getElementById("gate-btn");
        function sha256(str) {
          return crypto.subtle
            .digest("SHA-256", new TextEncoder().encode(str))
            .then(function (buf) {
              return Array.prototype.map
                .call(new Uint8Array(buf), function (b) {
                  return b.toString(16).padStart(2, "0");
                })
                .join("");
            });
        }
        function unlock() {
          var v = (input.value || "").trim();
          if (!v) {
            msg.textContent = "请输入密码";
            input.focus();
            return;
          }
          sha256(v).then(function (h) {
            if (PASSWORDS.indexOf(h) !== -1) {
              msg.textContent = "";
              gate.classList.add("gate-open");
              loadApp();
              setTimeout(function () {
                gate.parentNode && gate.parentNode.removeChild(gate);
              }, 600);
            } else {
              msg.textContent = "密码不正确，请重试";
              input.value = "";
              input.focus();
            }
          });
        }
        function loadApp() {
          var s = document.createElement("script");
          s.type = "module";
          s.src = "./app.bundle.v6.js?v=8";
          document.body.appendChild(s);
        }
        btn.addEventListener("click", unlock);
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            unlock();
          }
        });
        input.focus();
      })();
    </script>
  </body>
</html>
